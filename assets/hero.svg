<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">World of Oishi</title><desc id="desc">Typographic editorial banner with glowing circles and angular orbital lines</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09090D"/><stop offset="1" stop-color="#20101d"/></linearGradient>
<linearGradient id="pink" x1="0" x2="1"><stop stop-color="#FF5A1F"/><stop offset=".55" stop-color="#FF3DA7"/><stop offset="1" stop-color="#D6FF32"/></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
</defs>
<rect width="1200" height="390" rx="25" fill="url(#bg)"/>
<circle cx="1025" cy="190" r="130" fill="#FF3DA7" opacity=".14" filter="url(#blur)"/>
<circle cx="1025" cy="190" r="115" fill="none" stroke="#FF5A1F" stroke-width="16" transform="rotate(-24 1025 190) scale(1 .55) translate(0 150)"/>
<ellipse cx="1025" cy="185" rx="155" ry="62" fill="none" stroke="#D6FF32" stroke-width="7" transform="rotate(54 1025 185)"/>
<ellipse cx="1025" cy="185" rx="156" ry="63" fill="none" stroke="#FF3DA7" stroke-width="4" transform="rotate(-50 1025 185)"/>
<circle cx="1025" cy="185" r="39" fill="#FF5A1F"/><circle cx="1025" cy="185" r="22" fill="#09090D"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="55" y="55" fill="#D6FF32" font-size="14" font-weight="bold" letter-spacing="6">AN EXPERIMENTAL DIGITAL UNIVERSE / 2026</text>
<text x="49" y="176" fill="#FFF7F0" font-size="89" font-weight="900" letter-spacing="-5">WORLD OF</text>
<text x="49" y="286" fill="url(#pink)" font-size="129" font-weight="900" letter-spacing="-8">OISHI ✳</text>
<text x="55" y="343" fill="#BFB5C1" font-size="16" letter-spacing="3">IDEAS THAT REFUSE TO BE ORDINARY.</text>
</g>
<path d="M45 365H1150" stroke="#FF5A1F" stroke-opacity=".55"/>
</svg>
